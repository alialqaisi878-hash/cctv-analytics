name: Windows installer

# Builds CCTV-Analytics-Setup.exe and the online-update package, installs it on a clean
# Windows machine, and checks that the app starts and analyses the sample video.
# Bump app/version.py and merge to main to publish a release: installed copies then update themselves.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
            Set-Content app/version.py "__version__ = `"$v`"" -Encoding utf8
          }
          $v = (Select-String -Path app/version.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          "APP_VERSION=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version $v"

      - name: Download sample video and YOLO model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force samples, models, dist | Out-Null
          Invoke-WebRequest https://github.com/intel-iot-devkit/sample-videos/raw/master/people-detection.mp4 -OutFile samples/people.mp4
          Invoke-WebRequest https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt -OutFile models/yolo11n.pt
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -OutFile uv.zip
          Expand-Archive uv.zip -DestinationPath tools -Force
          # the charts library ships inside the app, so the dashboard works without internet
          New-Item -ItemType Directory -Force app/static/vendor | Out-Null
          Invoke-WebRequest https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js -OutFile app/static/vendor/chart.umd.min.js
          if ((Get-Item app/static/vendor/chart.umd.min.js).Length -lt 100000) { Write-Error "chart.js download looks wrong"; exit 1 }
          Get-Item tools/uv.exe

      - name: Build update package
        shell: pwsh
        run: |
          $stage = "build/update"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse app "$stage/app"
          Get-ChildItem -Recurse "$stage/app" -Include __pycache__ -Directory | Remove-Item -Recurse -Force
          New-Item -ItemType Directory -Force "$stage/installer" | Out-Null
          Copy-Item installer/setup.ps1 "$stage/installer/"
          Copy-Item run.py, requirements.txt, config.example.yaml, README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath dist/cctv-analytics-update.zip -Force

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\cctv-analytics.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist/*

      - name: Install on this machine (silent)
        shell: pwsh
        env:
          CI: "1"
        run: |
          # a non-English folder on purpose: that is how real users install it
          $dir = "$env:RUNNER_TEMP\برامج\CCTVAnalytics"
          "CCTV_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          # leftovers of a failed older setup (as on a PC where v1.0.2 stopped half way) must not break this one
          New-Item -ItemType Directory -Force "$dir\python\cpython-3.12.9-windows-x86_64-none" | Out-Null
          Set-Content "$dir\python\cpython-3.12.9-windows-x86_64-none\leftover.txt" "x"
          $p = Start-Process dist\CCTV-Analytics-Setup.exe -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=install-wizard.log", "/DIR=`"$dir`""
          Write-Host "Setup exit code: $($p.ExitCode)"
          if (Test-Path "$dir\install.log") { Get-Content "$dir\install.log" -Tail 40 }
          if (-not (Test-Path "$dir\.venv\Scripts\python.exe")) { Write-Error "venv missing"; exit 1 }
          Get-Content "$dir\.venv\pyvenv.cfg"
          if (-not (Test-Path "$dir\config.yaml")) { Write-Error "config.yaml missing"; exit 1 }
          Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\CCTV Analytics\CCTV Analytics.lnk"

      - name: Start the app and check it analyses the sample video
        shell: pwsh
        run: |
          $dir = $env:CCTV_DIR
          # a fresh install has no cameras: check that, then use the sample-video configuration for the smoke test
          if ((Get-Content "$dir\config.yaml" -Raw) -notmatch "(?m)^cameras: \[\]") { Write-Error "fresh config should have no cameras"; exit 1 }
          Copy-Item tests\demo-config.yaml "$dir\config.yaml" -Force
          # started exactly the way the desktop shortcut starts it: launch.bat opens the app window
          Start-Process "$env:ComSpec" -ArgumentList "/c", "launch.bat" -WorkingDirectory $dir -Wait
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep 5
            try {
              $cams = Invoke-RestMethod http://localhost:8000/api/cameras
              Write-Host ($cams | ConvertTo-Json -Depth 5 -Compress)
              if ($cams[0].status -eq "online" -and $cams[0].fps -gt 0) { $ok = $true }
              if ($ok -and $i -ge 12) { break }
            } catch { Write-Host "waiting for server..." }
          }
          Invoke-RestMethod http://localhost:8000/api/info | ConvertTo-Json -Compress
          Invoke-RestMethod http://localhost:8000/api/stats/summary | ConvertTo-Json -Depth 5 -Compress
          (Invoke-WebRequest http://localhost:8000/ -UseBasicParsing).StatusCode
          (Invoke-WebRequest http://localhost:8000/static/vendor/chart.umd.min.js -UseBasicParsing).StatusCode
          $pic = Invoke-WebRequest http://localhost:8000/frame/demo -UseBasicParsing
          Write-Host "live picture: $($pic.Headers['Content-Type']) $($pic.RawContentLength) bytes"
          # settings and cameras can be changed from the dashboard and are kept in data\
          $set = Invoke-RestMethod http://localhost:8000/api/settings -Method Post -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes('{"site_name":"شركة الاختبار","alerts":{"max_occupancy":7}}'))
          if ($set.site_name -ne "شركة الاختبار" -or $set.alerts.max_occupancy -ne 7) { Write-Error "settings were not saved"; exit 1 }
          Get-Content "$dir\data\settings.yaml" -Encoding utf8
          try { Invoke-RestMethod http://localhost:8000/api/cameras/add -Method Post -ContentType "application/json" -Body '{"ip":"127.0.0.1","port":9,"username":"admin","password":"x"}'; Write-Error "adding a camera that does not exist should fail"; exit 1 }
          catch { Write-Host "add camera (nothing there): HTTP $($_.Exception.Response.StatusCode.value__)" }
          # the app window must exist, and closing it must stop the program
          $win = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*--app=http://localhost:8000*" -and $_.CommandLine -notlike "*--type=*" }
          Write-Host "app window processes: $(@($win).Count) $(@($win).Name -join ',')"
          if (-not $win) { Get-Content "$dir\data\app.log" -Tail 30; Write-Error "app window was not opened"; exit 1 }
          $win | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          $stopped = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep 1
            if (-not (Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue)) { $stopped = $true; break }
          }
          Get-Content "$dir\data\app.log" -Tail 15
          if (-not $stopped) { Write-Error "program kept running after its window was closed"; exit 1 }
          if (-not $ok) { Write-Error "camera pipeline did not come online"; exit 1 }

      - name: Run tests on Windows
        shell: pwsh
        run: |
          $dir = $env:CCTV_DIR
          & "$dir\.venv\Scripts\python.exe" -m pip install pytest -q
          & "$dir\.venv\Scripts\python.exe" -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: CCTV-Analytics-Setup-${{ env.APP_VERSION }}
          path: |
            dist/CCTV-Analytics-Setup.exe
            dist/cctv-analytics-update.zip

      # A release is published whenever main carries a version (app/version.py) that has no
      # release yet. To ship an update: bump app/version.py and merge to main.
      - name: Check whether this version is already released
        id: rel
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:APP_VERSION" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Publish release
        if: github.event_name == 'push' && steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: CCTV Analytics v${{ env.APP_VERSION }}
          files: |
            dist/CCTV-Analytics-Setup.exe
            dist/cctv-analytics-update.zip
          generate_release_notes: true
