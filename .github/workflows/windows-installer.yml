name: Windows installer

# Builds CCTV-Analytics-Setup.exe and the online-update package, installs it on a clean
# Windows machine, and checks that the app starts and analyses the sample video.
# Bump app/version.py and merge to main to publish a release: installed copies then update themselves.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $v = $env:GITHUB_REF_NAME.TrimStart("v")
            Set-Content app/version.py "__version__ = `"$v`"" -Encoding utf8
          }
          $v = (Select-String -Path app/version.py -Pattern '"(.+)"').Matches[0].Groups[1].Value
          "APP_VERSION=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Version $v"

      - name: Download sample video and YOLO model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force samples, models, dist | Out-Null
          Invoke-WebRequest https://github.com/intel-iot-devkit/sample-videos/raw/master/people-detection.mp4 -OutFile samples/people.mp4
          Invoke-WebRequest https://github.com/ultralytics/assets/releases/download/v8.3.0/yolo11n.pt -OutFile models/yolo11n.pt
          Invoke-WebRequest https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip -OutFile uv.zip
          Expand-Archive uv.zip -DestinationPath tools -Force
          # the charts library ships inside the app, so the dashboard works without internet
          New-Item -ItemType Directory -Force app/static/vendor | Out-Null
          Invoke-WebRequest https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js -OutFile app/static/vendor/chart.umd.min.js
          if ((Get-Item app/static/vendor/chart.umd.min.js).Length -lt 100000) { Write-Error "chart.js download looks wrong"; exit 1 }
          Get-Item tools/uv.exe

      - name: Build update package
        shell: pwsh
        run: |
          $stage = "build/update"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item -Recurse app "$stage/app"
          Get-ChildItem -Recurse "$stage/app" -Include __pycache__ -Directory | Remove-Item -Recurse -Force
          New-Item -ItemType Directory -Force "$stage/installer" | Out-Null
          Copy-Item installer/setup.ps1 "$stage/installer/"
          Copy-Item run.py, requirements.txt, config.example.yaml, README.md $stage
          Compress-Archive -Path "$stage/*" -DestinationPath dist/cctv-analytics-update.zip -Force

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\cctv-analytics.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item dist/*

      - name: Install on this machine (silent)
        shell: pwsh
        env:
          CI: "1"
        run: |
          # a non-English folder on purpose: that is how real users install it
          $dir = "$env:RUNNER_TEMP\برامج\CCTVAnalytics"
          "CCTV_DIR=$dir" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          # Real users install a new Setup over the previous version: install the latest published release first,
          # put some user data in it, and then install this build on top.
          Invoke-WebRequest "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/CCTV-Analytics-Setup.exe" -OutFile previous-setup.exe
          $p = Start-Process .\previous-setup.exe -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`""
          Write-Host "Previous release setup exit code: $($p.ExitCode)"
          if (-not (Test-Path "$dir\.venv\Scripts\python.exe")) { Get-Content "$dir\install.log" -Tail 40; Write-Error "previous release did not install"; exit 1 }
          $prev = & "$dir\.venv\Scripts\python.exe" -c "import sys; sys.path.insert(0, r'$dir'); from app.version import __version__; print(__version__)"
          Write-Host "Previous release installed: $prev"
          New-Item -ItemType Directory -Force "$dir\data" | Out-Null
          Set-Content "$dir\data\settings.yaml" "privacy:`n  retention_days: 45`n" -Encoding utf8
          Add-Content "$dir\config.yaml" "`n# user edit that must survive upgrades"
          $p = Start-Process dist\CCTV-Analytics-Setup.exe -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=install-wizard.log", "/DIR=`"$dir`""
          Write-Host "Setup exit code: $($p.ExitCode)"
          if (Test-Path "$dir\install.log") { Get-Content "$dir\install.log" -Tail 40 }
          if (-not (Test-Path "$dir\.venv\Scripts\python.exe")) { Write-Error "venv missing"; exit 1 }
          Get-Content "$dir\.venv\pyvenv.cfg"
          if (-not (Test-Path "$dir\config.yaml")) { Write-Error "config.yaml missing"; exit 1 }
          if (-not (Select-String -Path "$dir\config.yaml" -Pattern "user edit that must survive" -Quiet)) { Write-Error "the upgrade overwrote config.yaml"; exit 1 }
          if (-not (Select-String -Path "$dir\data\settings.yaml" -Pattern "retention_days: 45" -Quiet)) { Write-Error "the upgrade lost the user's settings"; exit 1 }
          $now = & "$dir\.venv\Scripts\python.exe" -c "import sys; sys.path.insert(0, r'$dir'); from app.version import __version__; print(__version__)"
          Write-Host "Installed after upgrade: $now"
          if ($now -ne $env:APP_VERSION) { Write-Error "upgrade left version $now"; exit 1 }
          Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\CCTV Analytics\CCTV Analytics.lnk"

      - name: Start the app and check it analyses the sample video
        shell: pwsh
        env:
          # 1 second: page activity alone would stop the program at once. It must keep running anyway,
          # because a minimised window's page can be frozen by the browser for minutes.
          CCTV_WINDOW_IDLE_S: "1"
        run: |
          $dir = $env:CCTV_DIR
          # use the sample-video configuration for the smoke test (the real default has no cameras)
          if ((Get-Content config.example.yaml -Raw) -notmatch "(?m)^cameras: \[\]") { Write-Error "default config should have no cameras"; exit 1 }
          Copy-Item tests\demo-config.yaml "$dir\config.yaml" -Force
          # started exactly the way the desktop shortcut starts it: launch.bat opens the app window
          # no -Wait: it would also wait for the app that launch.bat leaves running
          Start-Process "$env:ComSpec" -ArgumentList "/c", "launch.bat" -WorkingDirectory $dir
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep 5
            try {
              $cams = Invoke-RestMethod http://localhost:8000/api/cameras
              Write-Host ($cams | ConvertTo-Json -Depth 5 -Compress)
              if ($cams[0].status -eq "online" -and $cams[0].fps -gt 0) { $ok = $true }
              if ($ok -and $i -ge 12) { break }
            } catch { Write-Host "waiting for server..." }
          }
          # the fast detector engine (OpenVINO) must work in a folder with an Arabic name, like real installs
          $eng = ""
          for ($i = 0; $i -lt 36; $i++) {
            $diag = (Invoke-WebRequest http://localhost:8000/api/diagnostics -UseBasicParsing).Content
            if ($diag -match "engine (openvino|pytorch)") { $eng = $Matches[1]; break }
            Start-Sleep 5
          }
          $diag -split "`n" | Select-String "shared detector"
          if ($eng -ne "openvino") { Get-Content "$dir\data\app.log" -Tail 40; Write-Error "the fast detector engine was not used: '$eng'"; exit 1 }
          Invoke-RestMethod http://localhost:8000/api/info | ConvertTo-Json -Compress
          Invoke-RestMethod http://localhost:8000/api/stats/summary | ConvertTo-Json -Depth 5 -Compress
          (Invoke-WebRequest http://localhost:8000/ -UseBasicParsing).StatusCode
          (Invoke-WebRequest http://localhost:8000/static/vendor/chart.umd.min.js -UseBasicParsing).StatusCode
          $pic = Invoke-WebRequest http://localhost:8000/frame/demo -UseBasicParsing
          Write-Host "live picture: $($pic.Headers['Content-Type']) $($pic.RawContentLength) bytes"
          # settings and cameras can be changed from the dashboard and are kept in data\
          $set = Invoke-RestMethod http://localhost:8000/api/settings -Method Post -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes('{"site_name":"شركة الاختبار","alerts":{"max_occupancy":7}}'))
          if ($set.site_name -ne "شركة الاختبار" -or $set.alerts.max_occupancy -ne 7) { Write-Error "settings were not saved"; exit 1 }
          Get-Content "$dir\data\settings.yaml" -Encoding utf8
          try { Invoke-RestMethod http://localhost:8000/api/cameras/add -Method Post -ContentType "application/json" -Body '{"ip":"127.0.0.1","port":9,"username":"admin","password":"x"}'; Write-Error "adding a camera that does not exist should fail"; exit 1 }
          catch { Write-Host "add camera (nothing there): HTTP $($_.Exception.Response.StatusCode.value__)" }
          # face recognition: switching it on downloads the models; then a person can be enrolled from a photo
          Invoke-RestMethod http://localhost:8000/api/settings -Method Post -ContentType "application/json" -Body '{"faces":{"enabled":true}}' | Out-Null
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 2; $ppl = Invoke-RestMethod http://localhost:8000/api/people; if ($ppl.status -eq "ready") { $ready = $true; break }; if ("$($ppl.status)" -like "error*") { break } }
          if (-not $ready) { Get-Content "$dir\data\app.log" -Tail 30; Write-Error "face recognition did not get ready: $($ppl.status)"; exit 1 }
          Invoke-WebRequest https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/lena.jpg -OutFile face.jpg
          $img = "data:image/jpeg;base64," + [Convert]::ToBase64String([IO.File]::ReadAllBytes("$PWD\face.jpg"))
          $person = Invoke-RestMethod http://localhost:8000/api/people -Method Post -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes((@{ name = "موظف تجربة"; image = $img } | ConvertTo-Json)))
          if ($person.photos -ne 1) { Write-Error "enrolling a person failed"; exit 1 }
          Write-Host "face recognition ready, person enrolled: $($person.id)"
          $feed = Invoke-RestMethod "http://localhost:8000/api/alerts/feed?after=0"
          Write-Host "alerts so far: $($feed.alerts.Count), unseen $($feed.unseen)"
          foreach ($a in $feed.alerts) { if ($a.has_image) { $r = Invoke-WebRequest "http://localhost:8000/api/alerts/$($a.id)/image" -UseBasicParsing; Write-Host "alert picture: $($r.RawContentLength) bytes"; break } }
          # the app window must exist, and closing it must stop the program
          $win = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*--app=http://localhost:8000*" -and $_.CommandLine -notlike "*--type=*" }
          Write-Host "app window processes: $(@($win).Count) $(@($win).Name -join ',')"
          if (-not $win) { Get-Content "$dir\data\app.log" -Tail 30; Write-Error "app window was not opened"; exit 1 }
          # 1) the program must NOT stop while its window is open, even though nothing else is going on
          Start-Sleep 12
          if (-not (Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue)) { Get-Content "$dir\data\app.log" -Tail 30; Write-Error "program stopped while its window was open"; exit 1 }
          Invoke-RestMethod http://127.0.0.1:8000/api/window/state | ConvertTo-Json -Compress
          # 2) closing the window must stop it (asked to close politely; a killed window is covered by the idle limit)
          $polite = $false
          $win | ForEach-Object { $p = Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue; if ($p -and $p.CloseMainWindow()) { $polite = $true } }
          Write-Host "window closed politely: $polite"
          Start-Sleep 3
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*--app=http://localhost:8000*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          $stopped = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 1
            if (-not (Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue)) { $stopped = $true; Write-Host "program stopped after $($i + 4)s"; break }
          }
          Get-Content "$dir\data\app.log" -Tail 15
          if (-not $stopped) { Write-Error "program kept running after its window was closed"; exit 1 }
          if (-not (Select-String -Path "$dir\data\app.log" -Pattern "launcher app window (closed|said goodbye)" -Quiet)) { Write-Error "the program did not stop because of the window"; exit 1 }
          if (-not $ok) { Write-Error "camera pipeline did not come online"; exit 1 }

      - name: Online update while the program is running
        shell: pwsh
        env:
          CCTV_WINDOW_IDLE_S: "25"
          CCTV_UPDATE_API: "http://127.0.0.1:8765"
        run: |
          $dir = $env:CCTV_DIR
          $py = "$dir\.venv\Scripts\python.exe"
          # a pretend "next release" (this build with a higher version number) on a local server
          $rel = "fake-github\repos\$($env:GITHUB_REPOSITORY -replace '/', '\')\releases"
          New-Item -ItemType Directory -Force $rel, build\next | Out-Null
          Copy-Item -Recurse build\update\* build\next
          Set-Content build\next\app\version.py '__version__ = "9.9.9"' -Encoding utf8
          Compress-Archive -Path build\next\* -DestinationPath fake-github\cctv-analytics-update.zip -Force
          '{"tag_name":"v9.9.9","body":"test","assets":[{"name":"cctv-analytics-update.zip","url":"http://127.0.0.1:8765/cctv-analytics-update.zip"}]}' | Set-Content "$rel\latest" -Encoding ascii
          $web = Start-Process $py -ArgumentList "-m", "http.server", "8765", "--bind", "127.0.0.1", "--directory", "fake-github" -PassThru -WindowStyle Hidden
          Start-Process "$env:ComSpec" -ArgumentList "/c", "launch.bat" -WorkingDirectory $dir
          $up = $false
          for ($i = 0; $i -lt 40; $i++) { Start-Sleep 3; try { $info = Invoke-RestMethod http://localhost:8000/api/info; $up = $true; break } catch { } }
          if (-not $up) { Write-Error "program did not start"; exit 1 }
          Write-Host "running version $($info.version)"
          $chk = Invoke-RestMethod http://localhost:8000/api/update/check -Method Post
          Write-Host ($chk | ConvertTo-Json -Compress)
          if (-not $chk.available) { Write-Error "the update was not offered"; exit 1 }
          try { Invoke-RestMethod http://localhost:8000/api/update/install -Method Post | Out-Null } catch { Write-Host "install request: $_ (the automatic update may already be running)" }
          $updated = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 3
            try { $v = (Invoke-RestMethod http://localhost:8000/api/info).version; if ($v -eq "9.9.9") { $updated = $true; Write-Host "updated and restarted after $(($i + 1) * 3)s"; break } } catch { Write-Host "restarting..." }
          }
          Get-Content "$dir\data\app.log" -Tail 25
          if (-not $updated) { Write-Error "the program did not come back on the new version"; exit 1 }
          # after the update: cameras analysed again, user files untouched, window still controls the program
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) { Start-Sleep 3; $cams = Invoke-RestMethod http://localhost:8000/api/cameras; if ($cams[0].status -eq "online" -and $cams[0].fps -gt 0) { $ok = $true; break } }
          if (-not $ok) { Write-Error "camera pipeline did not come back after the update"; exit 1 }
          if (-not (Select-String -Path "$dir\data\settings.yaml" -Pattern "retention_days: 45" -Quiet)) { Write-Error "the update lost the user's settings"; exit 1 }
          if (-not (Select-String -Path "$dir\config.yaml" -Pattern "^demo: true" -Quiet)) { Write-Error "the update overwrote config.yaml"; exit 1 }
          $win = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*--app=http://localhost:8000*" -and $_.CommandLine -notlike "*--type=*" }
          if (-not $win) { Write-Error "app window is gone after the update"; exit 1 }
          $win | ForEach-Object { $p = Get-Process -Id $_.ProcessId -ErrorAction SilentlyContinue; if ($p) { $p.CloseMainWindow() | Out-Null } }
          Start-Sleep 3
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*--app=http://localhost:8000*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          $stopped = $false
          for ($i = 0; $i -lt 60; $i++) { Start-Sleep 1; if (-not (Get-NetTCPConnection -LocalPort 8000 -State Listen -ErrorAction SilentlyContinue)) { $stopped = $true; break } }
          Stop-Process -Id $web.Id -Force -ErrorAction SilentlyContinue
          if (-not $stopped) { Write-Error "program kept running after its window was closed (after update)"; exit 1 }
          Write-Host "online update test passed"

      - name: Run tests on Windows
        shell: pwsh
        run: |
          $dir = $env:CCTV_DIR
          & "$dir\.venv\Scripts\python.exe" -m pip install pytest -q
          & "$dir\.venv\Scripts\python.exe" -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: CCTV-Analytics-Setup-${{ env.APP_VERSION }}
          path: |
            dist/CCTV-Analytics-Setup.exe
            dist/cctv-analytics-update.zip

      # A release is published whenever main carries a version (app/version.py) that has no
      # release yet. To ship an update: bump app/version.py and merge to main.
      - name: Check whether this version is already released
        id: rel
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "v$env:APP_VERSION" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT } else { "exists=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Publish release
        if: github.event_name == 'push' && steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          name: CCTV Analytics v${{ env.APP_VERSION }}
          files: |
            dist/CCTV-Analytics-Setup.exe
            dist/cctv-analytics-update.zip
          generate_release_notes: true
