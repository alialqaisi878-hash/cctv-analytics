# ===== CCTV Analytics configuration =====
# Copy to config.yaml (run.py does this automatically on first start) and edit.

site_name: "مكان العمل"
timezone: "Asia/Baghdad"
database: "data/cctv.db"

detector:
  model: "yolo11n.pt"     # n = fastest. Use yolo11s.pt for better accuracy on a stronger PC/GPU
  confidence: 0.35
  process_fps: 8          # analysed frames per second per camera (lower = less CPU)
  imgsz: 640
  device: null            # null = auto, "cpu", or "0" for the first NVIDIA GPU

privacy:
  show_notice: true       # shows the privacy notice on the dashboard
  blur_people: true       # blurs heads in the live view
  retention_days: 30      # aggregate data older than this is deleted automatically
  save_alert_pictures: true  # one picture per alert, deleted after retention_days. No video is ever saved

working_hours:            # used for "after hours" alerts and in reports
  start: "08:00"
  end: "17:00"
  days: [6, 0, 1, 2, 3]   # Mon=0 ... Sun=6  ->  Sunday to Thursday

alerts:
  after_hours_presence: true
  max_occupancy: 0        # e.g. 15 = alert when more than 15 people are in view. 0 = off
  cooldown_minutes: 15

agent:
  model: "claude-opus-5-5"
  language: "ar"
  daily_report_time: "17:30"   # automatic daily report ("" to disable)

server:
  host: "0.0.0.0"         # use "127.0.0.1" to allow access only from this PC
  port: 8000
  password: ""            # set a password to protect the dashboard (username can be anything)

updates:                  # online updates from GitHub, no reinstall needed
  enabled: true
  repo: "alialqaisi878-hash/cctv-analytics"
  token: ""               # only if the GitHub repo is private: a read-only token
  auto_install: true      # install new versions automatically outside working hours
  check_hours: 6

# Coordinates are fractions of the image: [x, y] where [0,0] = top-left, [1,1] = bottom-right.
# Line: people crossing it are counted. The arrow drawn on the video shows the "IN" direction;
# set invert: true if it points the wrong way.
# Zone: a polygon; the app measures how many people are inside and how long they stay.
# The easy way to add cameras is the "الكاميرات" page of the program. Cameras added there are kept
# in data/cameras.yaml, and settings changed in the program in data/settings.yaml.
cameras: []
  # Example of a camera written by hand:
  # - id: entrance
  #   name: "المدخل"
  #   source: "rtsp://admin:PASSWORD@192.168.1.64:554/Streaming/Channels/101"
  #   lines:
